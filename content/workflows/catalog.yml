phases:
- key: '0'
  name: Concept & intake
- key: '1'
  name: Specify
- key: '2'
  name: Plan & design
- key: '3'
  name: Develop
- key: '4'
  name: Verify
- key: '5'
  name: Review
- key: '6'
  name: Release
- key: '7'
  name: Operate & sustain
- key: X
  name: Cross-lifecycle
maturity:
  Floor: Deterministic checks only, no agent needed, build first
  First: First workflows to run end to end
  Later: Needs evals, environments or organizational readiness that usually does not exist yet
sources:
  PRM: Process reference map (7 phases × 6 roles)
  SDL: Secure development lifecycle activities
  STLC: Software testing life cycle
  AGN: Agentic vs traditional SDLC loop
  SIX: Six-phase SDLC model
  SEV: Seven-phase process model
  FRP: Gated feature release pipeline
workflows:
- id: W01
  phase: '0'
  name: Intake and classification
  decision: What kind of work is this, and which lane does it enter?
  trigger: Item enters the backlog
  agent: Draft classification (feature, bug, spike, production bug); propose change categories, size and initial risk tier
    from the description
  checks: Required intake fields present; size within the feature cap; categories from the allowed set
  people: Product owner classifies; tech lead confirms lane
  evidence: Intake record
  applies_to:
  - All
  maturity: First
  traditional:
    activity: Backlog grooming; project initiation; rough-order-of-magnitude estimate; scope and MVP definition
    owner: PM / BA; sponsor
    artefact: Backlog item; ROM estimate; project management plan
  notes: Absorbs change-risk classification. Sizing rule lives here.
- id: W02
  phase: '0'
  name: Security discovery and baseline
  decision: Which security objectives, regulations and baseline requirements apply to this product or feature set?
  trigger: New product, or a feature that introduces a new data class, integration or tenant boundary
  agent: Draft gap analysis of the proposed scope against the security baseline; list applicable regulations and certifications
  checks: Baseline checklist completeness; every baseline item has a status
  people: Security owner confirms objectives and gaps to close
  evidence: Baseline and gap record
  applies_to:
  - All
  maturity: Later
  traditional:
    activity: SDL discovery; security baselines and gap analysis; required certifications
    owner: Sponsor; security
    artefact: Security objectives; gap analysis
  notes: Runs rarely. Could fold into W04 for small products.
- id: W03
  phase: '1'
  name: Design-to-specification handoff
  decision: Is the design source stable and complete enough to specify from?
  trigger: Wireframes or prototype marked done
  agent: 'Derive a UI capability description from the design source: screens, flows, states, responsive behavior'
  checks: Design asset versioned and locked (gold master); all interactive states enumerated; only design-system tokens referenced
  people: Design owner signs off the baseline
  evidence: Handoff record
  applies_to:
  - UI
  maturity: First
  traditional:
    activity: User research and personas; wireframes to hi-fi mockups; usability review and sign-off; asset handoff
    owner: UX / Design
    artefact: Wireframes; mockups; prototype; design-system components
  notes: Gold-master governance lives here.
- id: W04
  phase: '1'
  name: Specification readiness
  decision: Is the specification ready to plan from?
  trigger: Specification marked ready for planning
  agent: Scan for ambiguity, missing edge cases, untestable acceptance criteria, unstated non-functional requirements; propose
    risk tier and open questions
  checks: Required sections present; every acceptance criterion has an identifier; mandatory questions have recorded answers
  people: Product owner resolves intent; engineering or security owner confirms constraints
  evidence: Readiness record
  applies_to:
  - All
  maturity: First
  traditional:
    activity: Requirement gathering and review; SRS; use cases and user stories; success criteria and KPIs; clarifications;
      requirement sign-off
    owner: PM / BA
    artefact: SRS; use cases; acceptance criteria; sign-off
  notes: The workflow that configures the rest.
- id: W05
  phase: '1'
  name: Brownfield pre-flight analysis
  decision: What does the existing system already do here, and what must not change?
  trigger: Specification touches existing code (not greenfield)
  agent: Map affected components, current behavior, conventions, implicit rules and dependencies from the codebase
  checks: Symbol and dependency navigation is deterministic (language server or equivalent); report cites file locations
  people: Architect confirms or corrects the analysis
  evidence: Analysis report attached to the specification
  applies_to:
  - All
  maturity: First
  traditional:
    activity: Feasibility and constraints; impact analysis; technical spike input
    owner: Architecture; senior developer
    artefact: Often nothing written
  notes: Traditional counterpart was usually informal.
- id: W06
  phase: '1'
  name: Threat modeling
  decision: Which threats apply to this change, and which mitigations are required?
  trigger: Specification touches authentication, authorization, data classes, external integrations or trust boundaries
  agent: Draft threat model from the specification and architecture; propose mitigations mapped to acceptance criteria
  checks: Every trust boundary named in the plan has an entry; every mitigation traces to a criterion or a rule
  people: Security owner validates the model and required mitigations
  evidence: Threat model record
  applies_to:
  - API
  - Data
  maturity: Later
  traditional:
    activity: Threat modeling (preparation, analysis, mitigations, validation); threat model updates
    owner: Senior engineers; project managers; security
    artefact: Threat model
  notes: SDL activity. Also updated at plan time.
- id: W07
  phase: '1'
  name: Spike
  decision: Which option, or is this feasible at all?
  trigger: A bounded question with a time box
  agent: Explore options; prototype; summarize trade-offs with evidence
  checks: Time box enforced; output in the required decision-record format
  people: Decision recorded with rationale; does not count as delivery throughput
  evidence: Decision record
  applies_to:
  - All
  maturity: Later
  traditional:
    activity: Technical spike; proof of concept; feasibility study; high-level solution options
    owner: Architecture; development
    artefact: Demo; verbal conclusion
  notes: Low frequency; keep in catalog, low priority.
- id: W08
  phase: '2'
  name: Plan and architecture conformance
  decision: Is the technical approach acceptable, and which gates apply?
  trigger: Readiness record accepted
  agent: Draft plan from the specification; check against the constitution; identify boundaries crossed and change categories;
    draft gate declaration
  checks: Constitution rules routed to gates are checked; gate declaration committed with lane, categories and named reviewers
  people: Tech lead owns the plan; architect approves exceptions
  evidence: Plan with gate declaration
  applies_to:
  - All
  maturity: First
  traditional:
    activity: System and data design; system design document; architecture diagram; design review and standards; component
      and module design
    owner: Architecture; development
    artefact: SDD; architecture diagram; DFD; tech-design notes
  notes: Where the risk tier becomes the gate set.
- id: W09
  phase: '2'
  name: API contract design
  decision: Is the interface contract agreed before implementation starts?
  trigger: Plan declares a new or changed API surface
  agent: Draft or update the contract from the specification; flag breaking changes and undocumented surface
  checks: Schema valid; breaking-change diff against the current version; versioning rule applied
  people: API owner approves; consumers notified for breaking changes
  evidence: Contract record
  applies_to:
  - API
  maturity: First
  traditional:
    activity: Interface and API contracts; interface design for user and other systems
    owner: Architecture
    artefact: API specification (OpenAPI or equivalent)
  notes: Contract-first principle.
- id: W10
  phase: '2'
  name: Data model and migration plan
  decision: Is the data change designed safely, with a way back?
  trigger: Plan declares a data model change or migration
  agent: Draft schema change, migration sequence and rollback; identify affected data and consumers
  checks: Schema diff; migration and rollback scripts present; data classification recorded
  people: Data owner approves the design
  evidence: Data design record
  applies_to:
  - Data
  maturity: First
  traditional:
    activity: Database design; ER diagram; tables, relationships, keys and constraints
    owner: Architecture; DBA
    artefact: ER diagram; data design
  notes: Execution is W16.
- id: W11
  phase: '2'
  name: Security design review
  decision: Does the design meet the security requirements and mitigations?
  trigger: Plan for a change with tier-3 security categories
  agent: Review the plan against the baseline and threat model; list unmitigated threats
  checks: Every required mitigation traces to a task or a rule
  people: Security reviewer (tier 3) approves
  evidence: Security design record
  applies_to:
  - API
  - Data
  maturity: Later
  traditional:
    activity: Security design review; security requirements; privacy impact assessment
    owner: Development team; security expert
    artefact: Review record
  notes: SDL activity. Could be a gate inside W08 for lower tiers.
- id: W12
  phase: '2'
  name: Task traceability and test planning
  decision: Is the work ready to start (definition of ready)?
  trigger: Plan accepted
  agent: Generate tasks from the plan; map every acceptance criterion to implementation and test tasks; classify each criterion
    under the testing contract
  checks: No orphan criteria; no task without a criterion; test tasks precede implementation tasks; stable task identifiers
  people: Dev lead confirms sequencing; QA lead owns the testing-contract classification
  evidence: Tasks file with traceability
  applies_to:
  - All
  maturity: First
  traditional:
    activity: Task breakdown; sprint planning; effort estimation; test plan and strategy; testability review; traceability
      to requirements
    owner: Development; QA
    artefact: Tickets; estimates; test plan; traceability matrix
  notes: Absorbs STLC test planning.
- id: W13
  phase: '3'
  name: Task execution loop
  decision: Is this task done to the agreed standard?
  trigger: Task picked up
  agent: Implement the task; run the quality command; self-correct within the retry limit; write the commit message with task
    identifier
  checks: Lint, type check, unit tests, sandbox and permission boundaries, command restrictions, branch protection
  people: Developer directs and inspects; stops the loop on repeated failure
  evidence: Commit linked to the task with check results
  applies_to:
  - All
  maturity: Floor
  traditional:
    activity: Feature implementation; unit testing; coding standards; branch and merge; integration builds
    owner: Development
    artefact: Commits; unit tests
  notes: The quality command is the floor. No agent needed to start.
- id: W14
  phase: '3'
  name: Documentation generation
  decision: Is the documentation current with the change?
  trigger: Change touches a public surface, a runbook or an architecture decision
  agent: Generate or update API docs from the contract, ADR drafts, runbook steps and user-facing notes
  checks: Docs diff present when a public surface changed; links resolve; generated sections marked
  people: Owner reviews substance, not formatting
  evidence: Docs record
  applies_to:
  - All
  maturity: Later
  traditional:
    activity: Tech-design notes; code documentation; user documentation; training material (docs only)
    owner: Development; PM
    artefact: Wiki pages; comments; manuals
  notes: 'AGN: docs generated inline rather than afterwards.'
- id: W15
  phase: '3'
  name: Dependency change
  decision: May this library or version enter the codebase?
  trigger: Manifest or lockfile changes
  agent: Summarize what the dependency is for and what it replaces; note maintenance signals
  checks: License policy; vulnerability scan; version pinning; approved-source check
  people: Architect approves new dependencies; security owner for flagged ones
  evidence: Dependency record
  applies_to:
  - All
  maturity: Floor
  traditional:
    activity: Third-party software tracking and inventory; library approval; open-source licensing review
    owner: Senior technical lead; security
    artefact: Inventory; wiki entry
  notes: Scanning is a floor check; approval is the workflow.
- id: W16
  phase: '3'
  name: Data change execution
  decision: Is this migration safe to run, and can it be undone?
  trigger: Migration script committed
  agent: Draft migration and rollback; identify affected records and downtime window
  checks: Migration rehearsal on representative data; rollback rehearsal; row-count and integrity checks
  people: Data owner approves the run
  evidence: Rehearsal and rollback record
  applies_to:
  - Data
  maturity: First
  traditional:
    activity: Migration script review; DBA review; legacy data migration
    owner: DBA; development
    artefact: Reviewed script; backup plan
  notes: Pairs with W10.
- id: W17
  phase: '4'
  name: Acceptance-test generation and execution
  decision: Does the change meet its acceptance criteria?
  trigger: Implementation tasks complete, or on every pull request for the criteria in scope
  agent: Generate test scenarios from acceptance criteria; separate generated from pre-existing tests; propose test data
  checks: Tests execute in CI; results stored with criterion identifiers; changed-code coverage against baseline
  people: QA lead judges scenario adequacy and coverage gaps
  evidence: Test results with criterion identifiers
  applies_to:
  - All
  maturity: First
  traditional:
    activity: Test-case design; test-data setup; test execution; defect logging; regression testing; functional and integration
      testing
    owner: QA
    artefact: Test cases; execution log; defect tickets; test summary
  notes: Absorbs four STLC stages.
- id: W18
  phase: '4'
  name: Security verification
  decision: Are the access and exposure boundaries intact for this change?
  trigger: Change carries a security category, or on every pull request for the floor checks
  agent: Trace access paths through the change; explain threats introduced; propose remediation
  checks: Access tests by identity; secret scanning; static analysis; dependency audit; dynamic analysis where an environment
    exists
  people: Security owner for tier-3 categories; otherwise the reviewer
  evidence: Security check record
  applies_to:
  - All
  maturity: Floor
  traditional:
    activity: Static analysis; dynamic analysis; vulnerability scanning; fuzzing; security review; secure coding checklist
    owner: Developers; QA; security expert
    artefact: Scan reports; review ticket
  notes: Secret scanning and SAST are floor; access tests are first.
- id: W19
  phase: '4'
  name: Performance verification
  decision: Does the change stay within its performance budget?
  trigger: Change carries a performance category, or touches a budgeted path
  agent: Select scenarios relevant to the change; analyze regressions against baseline
  checks: Budget thresholds; regression against baseline; scenario executed in a representative environment
  people: Owner accepts or rejects a budget change
  evidence: Performance record
  applies_to:
  - All
  maturity: Later
  traditional:
    activity: Non-functional review; performance and load testing
    owner: Architecture; QA
    artefact: Load test report
  notes: Needs a load environment; often could-not-run at first.
- id: W20
  phase: '4'
  name: Accessibility and visual regression
  decision: Is the interface still correct, accessible and consistent?
  trigger: Change touches interface files
  agent: Identify changed screens and states; draft what a person should look at
  checks: Accessibility rules; visual diff; both themes; all component states; design-system tokens only
  people: Design owner judges intent and acceptable differences
  evidence: Interface check record
  applies_to:
  - UI
  maturity: First
  traditional:
    activity: Design QA versus build; pixel and interaction review; accessibility checks; visual-regression review; usability
      testing
    owner: UX / Design; QA
    artefact: Screenshots; a11y report
  notes: FRP UI variant.
- id: W21
  phase: '4'
  name: API contract conformance
  decision: Does the implementation match the agreed contract?
  trigger: Change touches an endpoint
  agent: Diff contract and implementation; flag undocumented surface used by clients
  checks: Contract tests; schema validation; breaking-change detection; consumer contracts where they exist
  people: API owner approves version bumps
  evidence: Conformance record
  applies_to:
  - API
  maturity: First
  traditional:
    activity: Interface testing; integration testing between modules; consumer verification
    owner: Development; QA
    artefact: Integration test results
  notes: FRP API variant.
- id: W22
  phase: '4'
  name: System integration and acceptance evidence
  decision: Does the integrated system behave, and does the business accept it?
  trigger: Feature validated at pull-request level; SIT entry criteria met
  agent: Assemble the evidence pack; draft UAT scripts from acceptance criteria; summarize open defects and dispositions
  checks: SIT entry evidence present; environment and configuration version recorded; every criterion has a disposition
  people: QA lead runs SIT, including manual paths that span hardware, firmware and cloud; business owner signs acceptance
  evidence: SIT and acceptance record
  applies_to:
  - All
  maturity: Later
  traditional:
    activity: System testing; user acceptance testing; UAT coordination; business sign-off; test summary; acceptance contract
    owner: QA; PM; business
    artefact: Test summary; UAT sign-off; acceptance contract
  notes: Human-led; the agent assembles evidence. Manual SIT stays where paths cannot be reproduced in CI.
- id: W23
  phase: '5'
  name: Pull-request verification
  decision: Is this change ready to merge?
  trigger: Pull request marked ready; revision changes
  agent: Compare the diff with the specification; trace affected paths; draft findings with locations and reasons; summarize
  checks: All required checks for the tier; expected checks recorded before results; enforcement status verified
  people: Reviewer decides on design, unresolved questions and adequacy of verification
  evidence: Verification record
  applies_to:
  - All
  maturity: First
  traditional:
    activity: Code review; design-adherence review; peer review
    owner: Development; architecture
    artefact: Approval comment
  notes: The Part 5 example. Aggregates W17-W21 results.
- id: W24
  phase: '5'
  name: Design and architecture review
  decision: Is the design acceptable given its trade-offs?
  trigger: Tier-3 change, or an explicit architecture decision
  agent: Summarize the decision, alternatives considered and consequences
  checks: None that can be mechanized
  people: Named specialist reviewer with capacity
  evidence: Design decision record (ADR)
  applies_to:
  - All
  maturity: Later
  traditional:
    activity: Architecture board; design review; standards governance
    owner: Architecture
    artefact: Meeting minutes; ADR
  notes: Judgment-only workflow; the agent only prepares.
- id: W25
  phase: '6'
  name: Release readiness
  decision: Is this release safe to deploy?
  trigger: Release candidate tagged
  agent: Aggregate evidence across the changes; draft release notes and known risks; check for missing records
  checks: All required records present and current for the candidate revision; rollback path demonstrated; configuration version
    recorded; final license and security gap checks
  people: Release owner approves; mandatory organizational controls (CAB, security sign-off) unchanged
  evidence: Release record
  applies_to:
  - All
  maturity: First
  traditional:
    activity: Go/no-go input; release-readiness review; release notes; stakeholder comms; final security gap analysis; final
      privacy review; open-source licensing review; test closure
    owner: PM; DevOps; QA; security
    artefact: Release notes; approval; acceptance contract
  notes: Absorbs STLC test closure and SDL release activities.
- id: W26
  phase: '6'
  name: Deployment and post-deploy verification
  decision: Is the deployment healthy, or do we roll back?
  trigger: Deployment started
  agent: Compare observed health to expected; summarize anomalies
  checks: Health checks; smoke tests; toggles; deployment event and environment recorded; rollback rehearsed
  people: On-call decides rollback or proceed; hypercare owner named
  evidence: Deployment record
  applies_to:
  - All
  maturity: First
  traditional:
    activity: Deployment plan and checklist; production environment setup; smoke and sanity; rollback plan; config and secrets;
      deployment notice; deployment strategy (phased, rolling, pilot)
    owner: DevOps / Platform
    artefact: Deployment notice; runbook
  notes: Deployment strategy is a plan input, not a workflow.
- id: W27
  phase: '7'
  name: Incident remediation
  decision: Mitigate now, roll back, or fix forward?
  trigger: Alert or incident opened
  agent: Triage; correlate logs, metrics and recent changes; propose remediation; draft the fix as a pull request
  checks: Rollback available; proposed fix passes pull-request verification before deploy
  people: On-call decides the response
  evidence: Incident record
  applies_to:
  - All
  maturity: Later
  traditional:
    activity: Incident response; incident verification; defect resolution; hotfix readiness; corrective maintenance
    owner: DevOps / SRE; development; QA
    artefact: Incident ticket; hotfix
  notes: 'AGN: agent-assisted remediation. Never auto-deploys.'
- id: W28
  phase: '7'
  name: Incident-to-development feedback
  decision: What must change upstream so this does not recur?
  trigger: Incident closed, or escaped defect classified
  agent: Propose root cause; identify which check passed wrongly, was absent, or was bypassed; draft the regression case
  checks: Proposed test reproduces the failure before the fix and passes after
  people: Owner picks the conversion (criterion, test, validator, eval) and the workflow it lands in
  evidence: Feedback record linked to the upstream change
  applies_to:
  - All
  maturity: First
  traditional:
    activity: Post-mortem; root-cause analysis; defect-driven backlog; tech-debt and improvement backlog; feedback loop
    owner: Development; QA; PM
    artefact: RCA document; backlog items
  notes: The loop that makes the factory real (Part 6).
- id: W29
  phase: '7'
  name: Vulnerability response
  decision: Are we exposed, and is the patch verified?
  trigger: Advisory published, or scanner finding
  agent: Map the advisory to affected components and versions; draft the patch change
  checks: Dependency audit; patch verification tests; exposure window recorded
  people: Security owner sets urgency and accepts closure
  evidence: Response record
  applies_to:
  - All
  maturity: First
  traditional:
    activity: Third-party software tracking and review; external vulnerability disclosure and response; security updates
    owner: Senior technical lead; security
    artefact: Spreadsheet; tickets
  notes: Scanning floor exists via W15.
- id: W30
  phase: '7'
  name: Usage and feedback intake
  decision: What should change based on how the product is actually used?
  trigger: Review cadence, or a threshold in analytics or support volume
  agent: Summarize analytics, support tickets and UX feedback into candidate backlog items with evidence links
  checks: None deterministic; every candidate cites its source
  people: Product owner prioritizes; enters W01
  evidence: Feedback digest
  applies_to:
  - All
  maturity: Later
  traditional:
    activity: Adoption tracking; UX analytics; feedback-driven design backlog; benefits realization; perfective maintenance
    owner: PM; UX / Design
    artefact: Analytics dashboards; backlog
  notes: Feeds W01. Low deterministic content.
- id: W31
  phase: '7'
  name: Decommission and data disposal
  decision: Can this component or data be retired safely and compliantly?
  trigger: Retirement decision, or retention period expiry
  agent: Inventory data, dependencies and consumers; list retention obligations
  checks: Retention policy rules; dependency check for remaining consumers; key destruction verified
  people: Data owner and compliance approve
  evidence: Disposal record
  applies_to:
  - All
  maturity: Later
  traditional:
    activity: Disposal; data retention and disposal; crypto-shredding
    owner: Compliance; platform
    artefact: Disposal record
  notes: SDL Disposal phase. Rare but regulated.
- id: W32
  phase: X
  name: Change control
  decision: Is this change approved to proceed against the baseline?
  trigger: Any change that alters scope, a controlled artefact or a production system under change management
  agent: Draft the change request with impact drawn from existing evidence records
  checks: Change log entry present; linked evidence current; scope-change document attached when scope moved
  people: Designated approver or CAB, per the operating model
  evidence: Change record
  applies_to:
  - All
  maturity: First
  traditional:
    activity: Change requests; scope-change documentation; change impact and approval; change log; audit trail; regression
      on changes
    owner: PM / BA; architecture; DevOps
    artefact: Change request; change log
  notes: Evidence links now; automation later.
- id: W33
  phase: X
  name: Exception handling
  decision: May this requirement be departed from, for how long, and under what compensating control?
  trigger: A required check fails, or a control cannot be met
  agent: Draft the exception with scope, rationale and compensating control
  checks: Expiry enforced; underlying failed or missing check remains visible in evidence
  people: Designated gate owner approves; enterprise controls never waived here
  evidence: Exception record
  applies_to:
  - All
  maturity: First
  traditional:
    activity: Waiver; risk acceptance
    owner: Manager; security
    artefact: Email; risk register entry
  notes: Operating-model rule; kit enforces visibility.
- id: W34
  phase: X
  name: Kit upgrade
  decision: Adopt this kit version in this project?
  trigger: New kit release
  agent: None required; optional summary of behavior changes
  checks: init, doctor, verify; new validators in observe mode before blocking; enforcement verified
  people: Project owner accepts the upgrade
  evidence: Upgrade record
  applies_to:
  - All
  maturity: First
  traditional:
    activity: Tooling or framework upgrade (ad hoc)
    owner: Development; DevOps
    artefact: None
  notes: No traditional counterpart worth mapping.
- id: W35
  phase: X
  name: Evaluation rerun
  decision: Is this skill or model still acceptable after a change?
  trigger: Skill, prompt, adapter or model version changes
  agent: The subject under test
  checks: Evaluation suite against golden scenarios; report by scenario, not by count
  people: Owner reads which scenario failed and decides
  evidence: Evaluation report
  applies_to:
  - All
  maturity: Later
  traditional:
    activity: None
    owner: None
    artefact: None
  notes: Exists only because agents do.
