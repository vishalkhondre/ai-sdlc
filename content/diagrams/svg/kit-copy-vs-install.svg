<svg width="1200" height="628" viewBox="0 0 1200 628" xmlns="http://www.w3.org/2000/svg">
<style>
.t{font-size:32px;font-weight:600;fill:#1f1f1c}
.h{font-size:18px;font-weight:600}.s{font-size:14px}
.lab{font-size:16px;font-weight:600;fill:#5F5E5A}
.n{font-size:14px;fill:#5F5E5A}
.cap{font-size:20px;fill:#5F5E5A}
</style>
<rect width="1200" height="628" fill="#fff"/>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#888780" stroke-width="1.5"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#0F6E56" stroke-width="1.5"/></marker>
</defs>
<text class="t" x="78" y="80">Copy the folder, or install a version</text>
<text class="lab" x="78" y="136">Copy the folder</text>
<rect x="78" y="150" width="200" height="60" rx="10" fill="#faf9f5" stroke="#b4b2a9" stroke-width="1.5"/>
<text class="h" x="178" y="176" text-anchor="middle" fill="#1f1f1c">Team A's harness</text>
<text class="s" x="178" y="196" text-anchor="middle" fill="#5F5E5A">rules, skills, scripts, CI</text>
<line x1="178" y1="210" x2="178" y2="262" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="278" y1="180" x2="360" y2="180" stroke="#888780" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text class="n" x="320" y="170" text-anchor="middle">copy</text>
<rect x="368" y="150" width="200" height="60" rx="10" fill="#faf9f5" stroke="#b4b2a9" stroke-width="1.5"/>
<text class="h" x="468" y="176" text-anchor="middle" fill="#1f1f1c">Team B's copy</text>
<text class="s" x="468" y="196" text-anchor="middle" fill="#5F5E5A">edited to fit</text>
<line x1="468" y1="210" x2="468" y2="262" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
<text class="n" x="323" y="248" text-anchor="middle">three months later</text>
<rect x="78" y="270" width="200" height="88" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
<text class="s" x="178" y="296" text-anchor="middle" fill="#4A1B0C">access test v3</text>
<text class="s" x="178" y="316" text-anchor="middle" fill="#4A1B0C">covers background jobs</text>
<text class="s" x="178" y="340" text-anchor="middle" fill="#993C1D">fixed after an incident</text>
<rect x="368" y="270" width="200" height="88" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
<text class="s" x="468" y="296" text-anchor="middle" fill="#4A1B0C">access test v1</text>
<text class="s" x="468" y="316" text-anchor="middle" fill="#4A1B0C">endpoint only</text>
<text class="s" x="468" y="340" text-anchor="middle" fill="#993C1D">same defect, still possible</text>
<text class="n" x="323" y="392" text-anchor="middle">Nobody knows which version each repository runs.</text>
<line x1="620" y1="130" x2="620" y2="420" stroke="#d3d1c7" stroke-width="1"/>
<text class="lab" x="660" y="136">Install a version</text>
<rect x="760" y="150" width="240" height="60" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2"/>
<text class="h" x="880" y="176" text-anchor="middle" fill="#04342C">engineering-kit 0.2.0</text>
<text class="s" x="880" y="196" text-anchor="middle" fill="#0F6E56">registry, validators, evidence schema</text>
<line x1="820" y1="210" x2="740" y2="262" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#g)"/>
<line x1="940" y1="210" x2="1020" y2="262" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#g)"/>
<text class="n" x="880" y="248" text-anchor="middle">init · doctor · verify</text>
<rect x="660" y="270" width="200" height="88" rx="10" fill="#faf9f5" stroke="#0F6E56" stroke-width="1.5"/>
<text class="h" x="760" y="296" text-anchor="middle" fill="#1f1f1c">Team A</text>
<text class="s" x="760" y="318" text-anchor="middle" fill="#5F5E5A">kit 0.2.0 + own config</text>
<text class="s" x="760" y="340" text-anchor="middle" fill="#0F6E56">access fixtures, thresholds</text>
<rect x="900" y="270" width="200" height="88" rx="10" fill="#faf9f5" stroke="#0F6E56" stroke-width="1.5"/>
<text class="h" x="1000" y="296" text-anchor="middle" fill="#1f1f1c">Team B</text>
<text class="s" x="1000" y="318" text-anchor="middle" fill="#5F5E5A">kit 0.2.0 + own config</text>
<text class="s" x="1000" y="340" text-anchor="middle" fill="#0F6E56">different paths, same checks</text>
<text class="n" x="880" y="392" text-anchor="middle">A fix ships as 0.2.1. Both teams see the upgrade and choose when to take it.</text>
<rect x="78" y="440" width="1044" height="64" rx="12" fill="#faf9f5" stroke="#b4b2a9" stroke-width="1.5"/>
<text class="s" x="600" y="466" text-anchor="middle" fill="#1f1f1c" style="font-size:16px">Shared mechanism, versioned once. Project meaning, configured locally.</text>
<text class="s" x="600" y="490" text-anchor="middle" fill="#5F5E5A" style="font-size:15px">The evidence for every change records which kit version was in force.</text>
<text class="cap" x="600" y="574" text-anchor="middle">The difference is packaging, and packaging is more than a shared location.</text>
</svg>
