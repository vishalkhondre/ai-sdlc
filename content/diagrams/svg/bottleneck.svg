<svg width="1200" height="628" viewBox="0 0 1200 628" xmlns="http://www.w3.org/2000/svg">
<style>
.title { font-size:32px; font-weight:600; fill:#1f1f1c; }
.stage { font-size:22px; fill:#1f1f1c; }
.stage-hot { font-size:22px; fill:#26215C; font-weight:600; }
.pressure { font-size:19px; fill:#993C1D; font-weight:600; }
.pill { font-size:15px; fill:#26215C; }
.caption { font-size:21px; fill:#5F5E5A; }
.chev { font-size:26px; fill:#888780; }
</style>
<rect width="1200" height="628" fill="#ffffff"/>
<text class="title" x="90" y="88">Faster coding. What happens around it?</text>
<text class="pressure" x="180" y="232" text-anchor="middle">Clear enough to build?</text>
<line x1="180" y1="244" x2="180" y2="292" stroke="#993C1D" stroke-width="1.5"/>
<polygon points="174,286 186,286 180,296" fill="#993C1D"/>
<text class="pressure" x="705" y="232" text-anchor="middle">Enough evidence to trust?</text>
<line x1="705" y1="244" x2="705" y2="266" stroke="#993C1D" stroke-width="1.5"/>
<line x1="600" y1="266" x2="810" y2="266" stroke="#993C1D" stroke-width="1.5"/>
<line x1="600" y1="266" x2="600" y2="292" stroke="#993C1D" stroke-width="1.5"/>
<line x1="810" y1="266" x2="810" y2="292" stroke="#993C1D" stroke-width="1.5"/>
<polygon points="594,286 606,286 600,296" fill="#993C1D"/>
<polygon points="804,286 816,286 810,296" fill="#993C1D"/>
<text class="pressure" x="1020" y="232" text-anchor="middle">Ready to operate?</text>
<line x1="1020" y1="244" x2="1020" y2="292" stroke="#993C1D" stroke-width="1.5"/>
<polygon points="1014,286 1026,286 1020,296" fill="#993C1D"/>
<rect x="90"  y="300" width="180" height="80" rx="10" fill="#faf9f5" stroke="#b4b2a9" stroke-width="1.5"/>
<text class="stage" x="180" y="348" text-anchor="middle">Specify</text>
<rect x="300" y="300" width="180" height="80" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="2"/>
<text class="stage-hot" x="390" y="348" text-anchor="middle">Implement</text>
<rect x="510" y="300" width="180" height="80" rx="10" fill="#faf9f5" stroke="#b4b2a9" stroke-width="1.5"/>
<text class="stage" x="600" y="348" text-anchor="middle">Verify</text>
<rect x="720" y="300" width="180" height="80" rx="10" fill="#faf9f5" stroke="#b4b2a9" stroke-width="1.5"/>
<text class="stage" x="810" y="348" text-anchor="middle">Review</text>
<rect x="930" y="300" width="180" height="80" rx="10" fill="#faf9f5" stroke="#b4b2a9" stroke-width="1.5"/>
<text class="stage" x="1020" y="348" text-anchor="middle">Release</text>
<text class="chev" x="285" y="349" text-anchor="middle">&#8250;</text>
<text class="chev" x="495" y="349" text-anchor="middle">&#8250;</text>
<text class="chev" x="705" y="349" text-anchor="middle">&#8250;</text>
<text class="chev" x="915" y="349" text-anchor="middle">&#8250;</text>
<line x1="390" y1="380" x2="390" y2="402" stroke="#534AB7" stroke-width="1.5"/>
<rect x="316" y="402" width="148" height="32" rx="16" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
<text class="pill" x="390" y="423" text-anchor="middle">AI acceleration</text>
<text class="caption" x="600" y="540" text-anchor="middle">Faster implementation does not automatically mean faster delivery.</text>
</svg>
