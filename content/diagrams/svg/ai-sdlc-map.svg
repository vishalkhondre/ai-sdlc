<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
<style>
text{font-family:"Liberation Sans","DejaVu Sans",Arial,sans-serif}
.t{font-size:34px;font-weight:600;fill:#1f1f1c}
.sub{font-size:17px;fill:#5F5E5A}
.band{font-size:13px;font-weight:700;fill:#5F5E5A;letter-spacing:.8px}
.ph{font-size:16px;font-weight:600;fill:#1f1f1c}
.phs{font-size:12px;fill:#5F5E5A}
.wf{font-size:12.5px;font-weight:600;fill:#26215C}
.h{font-size:19px;font-weight:600}
.k{font-size:12px;font-weight:700;letter-spacing:.6px}
.b{font-size:14.5px;fill:#1f1f1c}
.s{font-size:13px;fill:#5F5E5A}
.chip{font-size:14px;font-weight:600}
.lab{font-size:13px;font-style:italic;fill:#5F5E5A}
.cap{font-size:17px;fill:#5F5E5A}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#888780" stroke-width="1.6"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#993C1D" stroke-width="1.6"/></marker>
</defs>
<rect width="1600" height="1000" fill="#fff"/>

<text class="t" x="80" y="62">The AI SDLC on one page</text>
<text class="sub" x="80" y="92">One centre, six dimensions around it. The workflow is where they all meet.</text>

<!-- ================= SDLC phases band ================= -->
<text class="band" x="80" y="132">SDLC PHASES · WHERE</text>
<g>
<rect x="80" y="144" width="148" height="58" rx="9" fill="#faf9f5" stroke="#b4b2a9" stroke-width="1.5"/><text class="ph" x="154" y="179" text-anchor="middle">Idea</text>
<rect x="240" y="144" width="148" height="58" rx="9" fill="#faf9f5" stroke="#b4b2a9" stroke-width="1.5"/><text class="ph" x="314" y="179" text-anchor="middle">Specification</text>
<rect x="400" y="144" width="148" height="58" rx="9" fill="#faf9f5" stroke="#b4b2a9" stroke-width="1.5"/><text class="ph" x="474" y="179" text-anchor="middle">Design</text>
<rect x="560" y="144" width="148" height="58" rx="9" fill="#faf9f5" stroke="#b4b2a9" stroke-width="1.5"/><text class="ph" x="634" y="179" text-anchor="middle">Develop</text>
<rect x="720" y="144" width="148" height="58" rx="9" fill="#faf9f5" stroke="#b4b2a9" stroke-width="1.5"/><text class="ph" x="794" y="179" text-anchor="middle">Build</text>
<rect x="880" y="144" width="148" height="58" rx="9" fill="#faf9f5" stroke="#b4b2a9" stroke-width="1.5"/><text class="ph" x="954" y="171" text-anchor="middle">QA</text><text class="phs" x="954" y="190" text-anchor="middle">security · performance</text>
<rect x="1040" y="144" width="148" height="58" rx="9" fill="#faf9f5" stroke="#b4b2a9" stroke-width="1.5"/><text class="ph" x="1114" y="179" text-anchor="middle">Deploy</text>
<rect x="1200" y="144" width="148" height="58" rx="9" fill="#faf9f5" stroke="#b4b2a9" stroke-width="1.5"/><text class="ph" x="1274" y="179" text-anchor="middle">Release</text>
<rect x="1360" y="144" width="160" height="58" rx="9" fill="#faf9f5" stroke="#b4b2a9" stroke-width="1.5"/><text class="ph" x="1440" y="179" text-anchor="middle">Operate</text>
</g>
<!-- workflows that run in phases -->
<rect x="240" y="212" width="148" height="26" rx="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/><text class="wf" x="314" y="230" text-anchor="middle">spec readiness</text>
<rect x="560" y="212" width="468" height="26" rx="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.8"/><text class="wf" x="794" y="230" text-anchor="middle">pull-request verification  (Part 7, drawn in full)</text>
<rect x="1200" y="212" width="148" height="26" rx="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/><text class="wf" x="1274" y="230" text-anchor="middle">release readiness</text>
<rect x="1360" y="212" width="160" height="26" rx="13" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/><text class="wf" x="1440" y="230" text-anchor="middle">incident feedback</text>
<!-- feedback loop across top -->
<path d="M1440 144 L1440 118 L314 118 L314 138" fill="none" stroke="#993C1D" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#r)"/>
<text class="lab" x="877" y="112" text-anchor="middle" fill="#993C1D" style="fill:#993C1D">what Operate learns changes what Specification asks</text>

<!-- ================= LEFT: what kind of change ================= -->
<text class="band" x="80" y="292">WHAT KIND OF WORK</text>
<rect x="80" y="304" width="400" height="112" rx="12" fill="#FAEEDA" stroke="#8a5a00" stroke-width="1.4"/>
<text class="k" x="100" y="330" fill="#8a5a00">PROJECT TYPES</text>
<rect x="100" y="344" width="170" height="52" rx="9" fill="#fff" stroke="#8a5a00" stroke-width="1.2"/><text class="chip" x="185" y="366" text-anchor="middle" fill="#5a3b00">Greenfield</text><text class="s" x="185" y="385" text-anchor="middle">rules from day one</text>
<rect x="290" y="344" width="170" height="52" rx="9" fill="#fff" stroke="#8a5a00" stroke-width="1.2"/><text class="chip" x="375" y="366" text-anchor="middle" fill="#5a3b00">Brownfield</text><text class="s" x="375" y="385" text-anchor="middle">pre-flight analysis first</text>

<rect x="80" y="432" width="400" height="176" rx="12" fill="#FAEEDA" stroke="#8a5a00" stroke-width="1.4"/>
<text class="k" x="100" y="458" fill="#8a5a00">FLOWS</text>
<rect x="100" y="472" width="170" height="52" rx="9" fill="#fff" stroke="#8a5a00" stroke-width="1.2"/><text class="chip" x="185" y="494" text-anchor="middle" fill="#5a3b00">Full feature</text><text class="s" x="185" y="513" text-anchor="middle">every gate</text>
<rect x="290" y="472" width="170" height="52" rx="9" fill="#fff" stroke="#8a5a00" stroke-width="1.2"/><text class="chip" x="375" y="494" text-anchor="middle" fill="#5a3b00">Bug fix</text><text class="s" x="375" y="513" text-anchor="middle">regression test first</text>
<rect x="100" y="536" width="170" height="52" rx="9" fill="#fff" stroke="#8a5a00" stroke-width="1.2"/><text class="chip" x="185" y="558" text-anchor="middle" fill="#5a3b00">Trivial change</text><text class="s" x="185" y="577" text-anchor="middle">floor checks only</text>
<rect x="290" y="536" width="170" height="52" rx="9" fill="#fff" stroke="#8a5a00" stroke-width="1.2"/><text class="chip" x="375" y="558" text-anchor="middle" fill="#5a3b00">Hotfix</text><text class="s" x="375" y="577" text-anchor="middle">same gates, shorter clock</text>
<text class="s" x="280" y="634" text-anchor="middle">Type × flow sets the risk tier:</text>
<text class="s" x="280" y="652" text-anchor="middle">which gates run, how deep, who approves.</text>

<!-- ================= CENTRE: core ================= -->
<text class="band" x="560" y="292">THE AI SDLC CORE</text>
<rect x="560" y="304" width="480" height="370" rx="16" fill="#fff" stroke="#534AB7" stroke-width="2"/>
<!-- layers -->
<rect x="580" y="322" width="440" height="72" rx="10" fill="#EEEDFE"/>
<text class="k" x="598" y="344" fill="#534AB7">DISCIPLINE</text><text class="h" x="598" y="370" fill="#26215C">Harness engineering</text>
<text class="s" x="1004" y="352" text-anchor="end">what the agent may do,</text><text class="s" x="1004" y="368" text-anchor="end">what a machine checks,</text><text class="s" x="1004" y="384" text-anchor="end">what a person decides</text>
<text class="lab" x="800" y="410" text-anchor="middle">packaged as</text>
<rect x="580" y="418" width="440" height="72" rx="10" fill="#E1F5EE"/>
<text class="k" x="598" y="440" fill="#0F6E56">ARTEFACT</text><text class="h" x="598" y="466" fill="#04342C">Engineering Kit</text>
<text class="s" x="1004" y="464" text-anchor="end">rules, validators, skills, evals,</text><text class="s" x="1004" y="480" text-anchor="end">evidence schema, adapters</text>
<text class="lab" x="800" y="506" text-anchor="middle">exercised by</text>
<rect x="580" y="514" width="440" height="72" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1.6"/>
<text class="k" x="598" y="536" fill="#993C1D">UNIT OF WORK</text><text class="h" x="598" y="562" fill="#4A1B0C">Workflows</text>
<text class="s" x="1004" y="560" text-anchor="end">one decision, end to end, with evidence</text><text class="s" x="1004" y="576" text-anchor="end">e.g. pull-request verification</text>
<text class="lab" x="800" y="602" text-anchor="middle">connected, they become</text>
<rect x="580" y="610" width="440" height="52" rx="10" fill="#fff" stroke="#5F5E5A" stroke-width="1.3" stroke-dasharray="6 4"/>
<text class="h" x="598" y="642" fill="#2C2C2A">Agentic software factory</text>
<text class="s" x="1004" y="641" text-anchor="end">emerges; not built up front</text>
<!-- phases -> core -->
<line x1="800" y1="240" x2="800" y2="298" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
<text class="lab" x="812" y="274">workflows run in each phase</text>

<!-- ================= RIGHT: how ================= -->
<text class="band" x="1120" y="292">SPECIFICATION PROCESS</text>
<rect x="1120" y="304" width="400" height="140" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.4"/>
<text class="k" x="1140" y="330" fill="#0F6E56">SDD FRAMEWORKS</text>
<rect x="1140" y="344" width="170" height="44" rx="9" fill="#fff" stroke="#0F6E56" stroke-width="1.2"/><text class="chip" x="1225" y="371" text-anchor="middle" fill="#04342C">GitHub Spec Kit</text>
<rect x="1330" y="344" width="170" height="44" rx="9" fill="#fff" stroke="#0F6E56" stroke-width="1.2"/><text class="chip" x="1415" y="371" text-anchor="middle" fill="#04342C">OpenSpec</text>
<text class="s" x="1140" y="414">Supply specify → plan → tasks.</text>
<text class="s" x="1140" y="431">The kit wraps them; it does not replace them.</text>

<text class="band" x="1120" y="476">OPERATING MODEL · WHO DECIDES</text>
<rect x="1120" y="488" width="400" height="186" rx="12" fill="#F1EFE8" stroke="#888780" stroke-width="1.4"/>
<text class="k" x="1140" y="514" fill="#5F5E5A">WAY OF WORKING</text>
<rect x="1140" y="528" width="170" height="44" rx="9" fill="#fff" stroke="#888780" stroke-width="1.2"/><text class="chip" x="1225" y="555" text-anchor="middle" fill="#2C2C2A">Scrum / Kanban</text>
<rect x="1330" y="528" width="170" height="44" rx="9" fill="#fff" stroke="#888780" stroke-width="1.2"/><text class="chip" x="1415" y="555" text-anchor="middle" fill="#2C2C2A">Jira / Confluence</text>
<text class="s" x="1140" y="598">Owns backlog, cadence, approvals</text>
<text class="s" x="1140" y="615">and decision rights. The kit enforces</text>
<text class="s" x="1140" y="632">its policies; it never holds authority.</text>
<text class="s" x="1140" y="656" style="font-style:italic">Policy wins when the two disagree.</text>

<!-- side arrows into core -->
<line x1="480" y1="560" x2="552" y2="560" stroke="#8a5a00" stroke-width="1.6" marker-end="url(#a)"/>
<text class="lab" x="484" y="536" style="font-size:12px">risk tier</text><text class="lab" x="484" y="550" style="font-size:12px">selects</text><text class="lab" x="484" y="578" style="font-size:12px">gates</text>
<line x1="1120" y1="380" x2="1048" y2="356" stroke="#0F6E56" stroke-width="1.6" marker-end="url(#a)"/>
<text class="lab" x="1050" y="398" style="font-size:12px">spec +</text><text class="lab" x="1050" y="412" style="font-size:12px">plan</text>
<line x1="1120" y1="580" x2="1048" y2="580" stroke="#888780" stroke-width="1.6" marker-end="url(#a)"/>
<text class="lab" x="1050" y="600" style="font-size:12px">decision</text><text class="lab" x="1050" y="614" style="font-size:12px">rights</text>

<!-- ================= BOTTOM: evidence ================= -->
<line x1="800" y1="674" x2="800" y2="738" stroke="#993C1D" stroke-width="1.6" marker-end="url(#r)"/>
<text class="lab" x="812" y="712" style="fill:#993C1D">every run leaves an evidence record</text>
<text class="band" x="80" y="730">STANDARDS · CERTIFICATIONS · AUDIT · WHAT MUST BE PROVABLE</text>
<rect x="80" y="742" width="1440" height="120" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="1.4"/>
<rect x="104" y="766" width="220" height="72" rx="9" fill="#fff" stroke="#993C1D" stroke-width="1.2"/><text class="chip" x="214" y="797" text-anchor="middle" fill="#4A1B0C">Templates</text><text class="s" x="214" y="818" text-anchor="middle">spec, plan, ADR, release</text>
<rect x="344" y="766" width="220" height="72" rx="9" fill="#fff" stroke="#993C1D" stroke-width="1.2"/><text class="chip" x="454" y="797" text-anchor="middle" fill="#4A1B0C">SOC 2</text><text class="s" x="454" y="818" text-anchor="middle">change management controls</text>
<text class="b" x="600" y="790">Auditors ask what the evidence record already holds:</text>
<text class="b" x="600" y="814">who approved what, under which rule, on which revision, with which checks passed,</text>
<text class="b" x="600" y="838">failed or could not run. Rule IDs make each control traceable to a gate or a named judgment.</text>

<!-- footer -->
<text class="cap" x="800" y="920" text-anchor="middle">Start in the centre with one workflow. Each dimension around it changes how that workflow runs, never whether it needs evidence.</text>
<text class="s" x="800" y="950" text-anchor="middle">Beyond Faster Coding · vishalkhondre.github.io/ai-sdlc</text>
</svg>
