<svg width="1200" height="628" viewBox="0 0 1200 628" xmlns="http://www.w3.org/2000/svg">
<style>
.t{font-size:32px;font-weight:600;fill:#1f1f1c}
.lab{font-size:15px;font-weight:600;fill:#5F5E5A}
.s{font-size:15px;fill:#1f1f1c}
.src{font-size:14px;fill:#4A1B0C}.dst{font-size:14px;fill:#04342C}.wf{font-size:12.5px;fill:#5F5E5A}
.h{font-size:13px;font-weight:600;fill:#5F5E5A}
.cap{font-size:20px;fill:#5F5E5A}
</style>
<rect width="1200" height="628" fill="#fff"/>
<defs><marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#0F6E56" stroke-width="1.5"/></marker></defs>
<text class="t" x="78" y="80">The boundary is wider than the merge</text>
<text class="lab" x="78" y="128">The boundary most diagrams draw</text>
<rect x="78" y="140" width="420" height="52" rx="10" fill="none" stroke="#993C1D" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="92" y="150" width="110" height="32" rx="6" fill="#faf9f5" stroke="#b4b2a9" stroke-width="1.2"/><text class="s" x="147" y="171" text-anchor="middle">Requirement</text>
<text class="s" x="230" y="171" text-anchor="middle" fill="#888780">›</text>
<rect x="258" y="150" width="110" height="32" rx="6" fill="#faf9f5" stroke="#b4b2a9" stroke-width="1.2"/><text class="s" x="313" y="171" text-anchor="middle">Code</text>
<text class="s" x="396" y="171" text-anchor="middle" fill="#888780">›</text>
<rect x="424" y="150" width="60" height="32" rx="6" fill="#faf9f5" stroke="#b4b2a9" stroke-width="1.2"/><text class="s" x="454" y="171" text-anchor="middle">Merge</text>
<text class="wf" x="288" y="214" text-anchor="middle" fill="#993C1D">Everything production teaches falls outside the line and is forgotten.</text>
<text class="lab" x="78" y="262">The boundary that lets the system learn</text>
<rect x="78" y="274" width="1044" height="52" rx="10" fill="none" stroke="#0F6E56" stroke-width="1.5"/>
<rect x="92" y="284" width="110" height="32" rx="6" fill="#faf9f5" stroke="#b4b2a9" stroke-width="1.2"/><text class="s" x="147" y="305" text-anchor="middle">Requirement</text>
<text class="s" x="228" y="305" text-anchor="middle" fill="#888780">›</text>
<rect x="254" y="284" width="90" height="32" rx="6" fill="#faf9f5" stroke="#b4b2a9" stroke-width="1.2"/><text class="s" x="299" y="305" text-anchor="middle">Code</text>
<text class="s" x="370" y="305" text-anchor="middle" fill="#888780">›</text>
<rect x="396" y="284" width="90" height="32" rx="6" fill="#faf9f5" stroke="#b4b2a9" stroke-width="1.2"/><text class="s" x="441" y="305" text-anchor="middle">Merge</text>
<text class="s" x="512" y="305" text-anchor="middle" fill="#888780">›</text>
<rect x="538" y="284" width="90" height="32" rx="6" fill="#faf9f5" stroke="#b4b2a9" stroke-width="1.2"/><text class="s" x="583" y="305" text-anchor="middle">Release</text>
<text class="s" x="654" y="305" text-anchor="middle" fill="#888780">›</text>
<rect x="680" y="284" width="110" height="32" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/><text class="s" x="735" y="305" text-anchor="middle" fill="#04342C">Production</text>
<text class="s" x="816" y="305" text-anchor="middle" fill="#888780">›</text>
<rect x="842" y="284" width="266" height="32" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/><text class="s" x="975" y="305" text-anchor="middle" fill="#04342C">What the system learns</text>
<text class="h" x="90" y="372">WHAT PRODUCTION TEACHES</text>
<text class="h" x="470" y="372">BECOMES</text>
<text class="h" x="860" y="372">WHICH CHANGES</text>
<line x1="78" y1="382" x2="1122" y2="382" stroke="#d3d1c7" stroke-width="1"/>
<text class="src" x="90" y="408">An escaped defect</text><line x1="400" y1="404" x2="456" y2="404" stroke="#0F6E56" stroke-width="1.2" marker-end="url(#g)"/><text class="dst" x="470" y="408">a regression test</text><text class="wf" x="860" y="408">verification workflow</text>
<text class="src" x="90" y="434">A recurring review comment</text><line x1="400" y1="430" x2="456" y2="430" stroke="#0F6E56" stroke-width="1.2" marker-end="url(#g)"/><text class="dst" x="470" y="434">a rule in the registry</text><text class="wf" x="860" y="434">every workflow that reads it</text>
<text class="src" x="90" y="460">A rule that keeps being violated</text><line x1="400" y1="456" x2="456" y2="456" stroke="#0F6E56" stroke-width="1.2" marker-end="url(#g)"/><text class="dst" x="470" y="460">a deterministic gate</text><text class="wf" x="860" y="460">CI, blocking</text>
<text class="src" x="90" y="486">A production failure</text><line x1="400" y1="482" x2="456" y2="482" stroke="#0F6E56" stroke-width="1.2" marker-end="url(#g)"/><text class="dst" x="470" y="486">an evaluation case for the agent</text><text class="wf" x="860" y="486">skill's eval suite</text>
<text class="src" x="90" y="512">A misunderstood requirement</text><line x1="400" y1="508" x2="456" y2="508" stroke="#0F6E56" stroke-width="1.2" marker-end="url(#g)"/><text class="dst" x="470" y="512">a new readiness question</text><text class="wf" x="860" y="512">specification workflow</text>
<text class="src" x="90" y="538">A procedure the team keeps repeating</text><line x1="400" y1="534" x2="456" y2="534" stroke="#0F6E56" stroke-width="1.2" marker-end="url(#g)"/><text class="dst" x="470" y="538">a skill in the kit</text><text class="wf" x="860" y="538">next kit version</text>
<text class="src" x="90" y="564">A brittle agent behavior</text><line x1="400" y1="560" x2="456" y2="560" stroke="#0F6E56" stroke-width="1.2" marker-end="url(#g)"/><text class="dst" x="470" y="564">a change to the harness</text><text class="wf" x="860" y="564">context, tools or permissions</text>
<text class="cap" x="600" y="608" text-anchor="middle">Not a model that keeps learning. An engineering system that keeps what its people find out.</text>
</svg>
