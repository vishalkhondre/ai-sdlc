<svg width="1200" height="628" viewBox="0 0 1200 628" xmlns="http://www.w3.org/2000/svg">
<style>
.t{font-size:32px;font-weight:600;fill:#1f1f1c}
.rule{font-size:19px;font-weight:600;fill:#1f1f1c}
.bh{font-size:18px;font-weight:600}.bs{font-size:14px}
.role{font-size:15px;font-weight:600}
.th{font-size:13px;fill:#5F5E5A;font-weight:600}.td{font-size:14px;fill:#1f1f1c}
.cap{font-size:20px;fill:#5F5E5A}
</style>
<rect width="1200" height="628" fill="#fff"/>
<text class="t" x="78" y="80">One rule, four mechanisms, three different roles</text>
<rect x="200" y="112" width="800" height="54" rx="10" fill="#faf9f5" stroke="#b4b2a9" stroke-width="1.5"/>
<text class="rule" x="600" y="146" text-anchor="middle">Users may only export records they are permitted to access</text>
<line x1="440" y1="166" x2="210" y2="222" stroke="#b4b2a9" stroke-width="1.5"/>
<line x1="540" y1="166" x2="468" y2="222" stroke="#b4b2a9" stroke-width="1.5"/>
<line x1="660" y1="166" x2="726" y2="222" stroke="#b4b2a9" stroke-width="1.5"/>
<line x1="760" y1="166" x2="984" y2="222" stroke="#b4b2a9" stroke-width="1.5"/>
<rect x="90" y="224" width="240" height="104" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
<text class="bh" x="210" y="256" text-anchor="middle" fill="#26215C">Specification</text>
<text class="bs" x="210" y="282" text-anchor="middle" fill="#534AB7">describes the behavior</text>
<text class="bs" x="210" y="302" text-anchor="middle" fill="#534AB7">the agent should produce</text>
<rect x="348" y="224" width="240" height="104" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
<text class="bh" x="468" y="256" text-anchor="middle" fill="#26215C">Skill</text>
<text class="bs" x="468" y="282" text-anchor="middle" fill="#534AB7">points the agent at the</text>
<text class="bs" x="468" y="302" text-anchor="middle" fill="#534AB7">approved authorization pattern</text>
<rect x="606" y="224" width="240" height="104" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="2"/>
<text class="bh" x="726" y="256" text-anchor="middle" fill="#4A1B0C">Test in CI</text>
<text class="bs" x="726" y="282" text-anchor="middle" fill="#993C1D">tries exports as different identities;</text>
<text class="bs" x="726" y="302" text-anchor="middle" fill="#993C1D">fails the merge on a leak</text>
<rect x="864" y="224" width="240" height="104" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
<text class="bh" x="984" y="256" text-anchor="middle" fill="#04342C">Reviewer</text>
<text class="bs" x="984" y="282" text-anchor="middle" fill="#0F6E56">asks whether the scenarios</text>
<text class="bs" x="984" y="302" text-anchor="middle" fill="#0F6E56">cover the real access boundaries</text>
<line x1="90" y1="348" x2="588" y2="348" stroke="#534AB7" stroke-width="1.5"/>
<text class="role" x="339" y="372" text-anchor="middle" fill="#534AB7">Guides. The agent can still get it wrong.</text>
<line x1="606" y1="348" x2="846" y2="348" stroke="#993C1D" stroke-width="1.5"/>
<text class="role" x="726" y="372" text-anchor="middle" fill="#993C1D">Enforces. Blocks the merge.</text>
<line x1="864" y1="348" x2="1104" y2="348" stroke="#0F6E56" stroke-width="1.5"/>
<text class="role" x="984" y="372" text-anchor="middle" fill="#0F6E56">Judges. Covers what checks miss.</text>
<rect x="90" y="410" width="1014" height="110" rx="10" fill="#faf9f5" stroke="#b4b2a9" stroke-width="1.5"/>
<text class="th" x="114" y="438">RULE</text>
<text class="th" x="380" y="438">AUTOMATED CHECK</text>
<text class="th" x="660" y="438">JUDGMENT OWNER</text>
<text class="th" x="900" y="438">KNOWN GAP</text>
<line x1="110" y1="450" x2="1084" y2="450" stroke="#d3d1c7" stroke-width="1"/>
<text class="td" x="114" y="478">Permitted records only</text>
<text class="td" x="380" y="478">Access test per identity</text>
<text class="td" x="660" y="478">QA lead: scenario coverage</text>
<text class="td" x="900" y="478">Background jobs untested</text>
<text class="td" x="114" y="504">Handlers must not import models</text>
<text class="td" x="380" y="504">Dependency check</text>
<text class="td" x="660" y="504">None needed</text>
<text class="td" x="900" y="504">None</text>
<text class="cap" x="600" y="580" text-anchor="middle">Every rule ends up in the inventory: backed by a check, assigned to a judgment, or an acknowledged gap.</text>
</svg>
