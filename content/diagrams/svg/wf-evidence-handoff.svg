<svg width="1200" height="628" viewBox="0 0 1200 628" xmlns="http://www.w3.org/2000/svg">
<style>
.t{font-size:32px;font-weight:600;fill:#1f1f1c}
.wh{font-size:17px;font-weight:600;fill:#1f1f1c}.ws{font-size:13px;fill:#5F5E5A}
.eh{font-size:14px;font-weight:600;fill:#04342C}.es{font-size:12.5px;fill:#0F6E56}
.n{font-size:14px;fill:#5F5E5A}
.cap{font-size:20px;fill:#5F5E5A}
</style>
<rect width="1200" height="628" fill="#fff"/>
<defs>
<marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#0F6E56" stroke-width="1.5"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#993C1D" stroke-width="1.5"/></marker>
</defs>
<text class="t" x="78" y="80">Workflows are built one at a time. They hand each other evidence.</text>
<rect x="78" y="150" width="220" height="80" rx="10" fill="#faf9f5" stroke="#b4b2a9" stroke-width="1.5"/>
<text class="wh" x="188" y="182" text-anchor="middle">Specification readiness</text>
<text class="ws" x="188" y="206" text-anchor="middle">decision: proceed to planning?</text>
<rect x="352" y="150" width="220" height="80" rx="10" fill="#faf9f5" stroke="#b4b2a9" stroke-width="1.5"/>
<text class="wh" x="462" y="182" text-anchor="middle">PR verification</text>
<text class="ws" x="462" y="206" text-anchor="middle">decision: ready to merge?</text>
<rect x="626" y="150" width="220" height="80" rx="10" fill="#faf9f5" stroke="#b4b2a9" stroke-width="1.5"/>
<text class="wh" x="736" y="182" text-anchor="middle">Release readiness</text>
<text class="ws" x="736" y="206" text-anchor="middle">decision: safe to deploy?</text>
<rect x="900" y="150" width="222" height="80" rx="10" fill="#faf9f5" stroke="#b4b2a9" stroke-width="1.5"/>
<text class="wh" x="1011" y="182" text-anchor="middle">Incident review</text>
<text class="ws" x="1011" y="206" text-anchor="middle">decision: what must change?</text>
<line x1="298" y1="190" x2="346" y2="190" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#g)"/>
<line x1="572" y1="190" x2="620" y2="190" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#g)"/>
<line x1="846" y1="190" x2="894" y2="190" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#g)"/>
<rect x="130" y="268" width="330" height="86" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
<text class="eh" x="295" y="292" text-anchor="middle">Readiness record</text>
<text class="es" x="295" y="312" text-anchor="middle">requirement revision · risk tier · open questions</text>
<text class="es" x="295" y="330" text-anchor="middle">tells verification which rules apply</text>
<line x1="295" y1="268" x2="322" y2="232" stroke="#0F6E56" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="500" y="268" width="300" height="86" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
<text class="eh" x="650" y="292" text-anchor="middle">Verification record</text>
<text class="es" x="650" y="312" text-anchor="middle">revision · checks run · decisions · outcome</text>
<text class="es" x="650" y="330" text-anchor="middle">supports release only for that revision</text>
<line x1="650" y1="268" x2="596" y2="232" stroke="#0F6E56" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="840" y="268" width="282" height="86" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
<text class="eh" x="981" y="292" text-anchor="middle">Release record</text>
<text class="es" x="981" y="312" text-anchor="middle">what was deployed · under which evidence</text>
<text class="es" x="981" y="330" text-anchor="middle">what the incident review reads later</text>
<line x1="981" y1="268" x2="870" y2="232" stroke="#0F6E56" stroke-width="1" stroke-dasharray="3 3"/>
<path d="M1122 190 L1150 190 L1150 420 L50 420 L50 190 L72 190" fill="none" stroke="#993C1D" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#r)"/>
<text class="n" x="600" y="444" text-anchor="middle" fill="#993C1D">A gap found in production becomes a new criterion, test, validator or eval — upstream, where it would have prevented the incident.</text>
<rect x="78" y="480" width="1044" height="56" rx="10" fill="#faf9f5" stroke="#b4b2a9" stroke-width="1.5"/>
<text class="n" x="600" y="504" text-anchor="middle">Evidence carries its scope with it. A verification result supports a release decision only if the revision, requirement and configuration still match.</text>
<text class="n" x="600" y="524" text-anchor="middle">Reuse without those checks is how duplicate approvals and stale assurance creep in.</text>
<text class="cap" x="600" y="590" text-anchor="middle">Connecting workflows is defining what evidence means to the next decision.</text>
</svg>
